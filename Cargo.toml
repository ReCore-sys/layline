[workspace]
resolver = "3"
members = [
    "src/bin",
    "src/game-loop",
    "src/logging",
    "src/network",
    "src/raknet",
    "src/network/codec",
    "src/network/packets",
    "src/macros",
    "src/components",
    "src/world"
, "src/shared", "src/lua", "src/config"]

[workspace.package]
version = "0.1.0"
edition = "2024"




[workspace.dependencies]
# Workspace deps
layline-logging = { path = "src/logging" }
layline-network = { path = "src/network" }
raknet-v6 = { path = "src/raknet" }
layline-game-loop = { path = "src/game-loop" }
layline-codec = { path = "src/network/codec" }
layline-packets = { path = "src/network/packets" }
layline-macros = { path = "src/macros" }
layline-components = { path = "src/components" }
layline-world = { path = "src/world" }
layline-shared = { path = "src/shared" }
layline-lua = { path = "src/lua" }
layline-config = { path = "src/config" }


# Async
tokio = "1.54.1"

# ECS
hecs = "0.11.2"

# Network
socket2 = "0.6.5"

# Byte manipulation
bytes = "1.12.1"

# Rand/crypto
rand = "0.10.3"
ahash = "0.8.12"

# Maths
glam = "0.34.3"

# Lua
mlua = { version = "0.12.2",  features = ["luajit", "serde"]}

# Errors
thiserror = "2.0.21"

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Serialization
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
serde_ini = "0.2.0"
serde-flexible = "0.1.1"

# Macros
strum = "0.28.0"
strum_macros = "0.28.0"
include_dir = { version = "0.7.4", features = ["glob"] }

# Build scripts and custom macros
syn = { version = "3.0.9", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

# Data structures
crossbeam-queue = "0.3.14"
dashmap = "7.0.0-rc2"

# CLI
clap = { version = "4.6.7", features = ["derive", "help", "env", "color"] }
