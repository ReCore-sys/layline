[package]
name = "raknet-v6"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["b23r0 <b23r0@foxmail.com>"]
description = "rust-raknet backport to raknet V6"
readme = "README.md"
license = "MIT"
keywords = ["raknet", "networking", "game"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
recovery-policy = []
send-policy = []

[dependencies]
bytes = "1.12.1"
socket2 = { version = "0.6.5", features = ["all"] }
rand = { version = "0.10.3", features = ["std"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
